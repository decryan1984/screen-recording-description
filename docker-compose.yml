# Sandboxed services. `docker compose up` starts the processing service.
#
# INPUT_DIR: host directory videos are read from and mounted at the same path in the container
# so absolute paths match. Defaults to the repo root (run compose from
# there). Override with `INPUT_DIR=/data docker compose up`.

# Stable project name so container names don't depend on the folder.
name: screen-recording-description

services:
  # Processing service (API + in-process worker) on http://127.0.0.1:8000.
  api:
    build:
      context: .
    image: screen-recording-description:latest
    entrypoint: ["uvicorn", "screen_recording_description.service:app",
                 "--host", "0.0.0.0", "--port", "8000"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ${INPUT_DIR:-${PWD}}:${INPUT_DIR:-${PWD}}:ro
      - ./output:/app/output
      - model-cache:/home/appuser/.cache
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 8g
    pids_limit: 512
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # On-demand batch run over the GUI-World dataset (the original CLI).
  # `docker compose run --rm pipeline --videos 457`
  pipeline:
    build:
      context: .
    image: screen-recording-description:latest
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      # Set on the host (`export GEMINI_API_KEY=...` or a .env file) to use
      # --run-online-inference. If not set the config.py default applies.
      - GEMINI_API_KEY
    volumes:
      - ./evaluation/data:/app/evaluation/data:ro
      - ./evaluation/results:/app/evaluation/results
      - model-cache:/home/appuser/.cache
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 8g
    pids_limit: 512
    profiles:
      - batch

  # OPTIONAL: containerised combined dashboard (Results and Service Metrics) on
  # http://127.0.0.1:8501. Switch views from the sidebar. Faster and easier to 
  # debug if run directly with Streamlit (`streamlit run src/screen_recording_description/dashboard.py`)
  # Start with: docker compose --profile dashboard up --build dashboard
  dashboard:
    build:
      context: .
    image: screen-recording-description:latest
    entrypoint:
      - streamlit
      - run
      - src/screen_recording_description/dashboard.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
      - --browser.gatherUsageStats=false
    environment:
      API_URL: "http://api:8000"
    depends_on:
      - api
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - ./evaluation/results:/app/evaluation/results:ro
      - ./output:/app/output:ro
      - model-cache:/home/appuser/.cache
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /home/appuser/.streamlit:size=16m,uid=10001,gid=10001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    pids_limit: 256
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    profiles:
      - dashboard

volumes:
  model-cache:
