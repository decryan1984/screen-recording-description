[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "screen-recording-description"
version = "0.1.0"
description = "Analyse desktop screen recordings with a Vision Language Model"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "av>=12.0.0",
    "opencv-python-headless>=4.8.0",
    "numpy>=1.24.0",
    "bert-score>=0.3.13",
    "rouge-score>=0.1.2",
]

[project.optional-dependencies]
# Only needed for the Streamlit results dashboard (results_dashboard.py)
dashboard = [
    "streamlit>=1.30.0",
    "pandas>=2.0.0",
    "altair>=5.0.0",
]
# Only needed for the FastAPI submission service (service.py)
api = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
]

[project.scripts]
screen-recording-description = "screen_recording_description.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
